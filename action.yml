name: MSVC Dev Cmd
description: Configure Microsoft Visual C++ command line on Windows runners
author: iShark5060

inputs:
  arch:
    description: Target architecture
    default: x64
  sdk:
    description: Windows SDK number to build for
  spectre:
    description: Enable Spectre mitigations
  toolset:
    description: VC++ compiler toolset version
  uwp:
    description: Build for Universal Windows Platform
  vsversion:
    description: The Visual Studio version to use. This can be the version number (e.g. 16.0 for 2019) or the year (e.g. "2019").

outputs:
  arch:
    description: Resolved target architecture passed to vcvarsall
  vcvarsall:
    description: Absolute path to the vcvarsall.bat (or vcbuildtools.bat) that was invoked
  installation-path:
    description: Visual Studio installation root inferred from vcvarsall location
  vs-version:
    description: Resolved Visual Studio version number (e.g. 18.0), when known
  vs-year:
    description: Resolved Visual Studio year (e.g. 2026), when known

runs:
  using: node24
  main: dist/index.cjs

branding:
  icon: terminal
  color: purple
