name: CI

permissions:
  contents: read

env:
  NODE_VERSION: 26

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: build-node26
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable pnpm
        run: npm install -g pnpm@12.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm run validate

      - name: Build action
        run: pnpm run build

      - name: Verify action bundle
        run: node --check dist/index.cjs

      - name: Upload action bundle
        uses: actions/upload-artifact@v7
        with:
          name: action-bundle
          path: dist/index.cjs
          if-no-files-found: error
          retention-days: 1

  integration:
    name: integration (${{ matrix.name }})
    needs: validate
    # This label is not registered until the Windows runner exists.
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            arch: amd64
            compile: cl.exe hello.c && hello.exe
          - name: arch aliases
            arch: Win32
            compile: cl.exe hello.c && hello.exe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download action bundle
        uses: actions/download-artifact@v8
        with:
          name: action-bundle
          path: dist

      - name: Enable Developer Command Prompt
        uses: ./
        with:
          arch: ${{ matrix.arch }}

      - name: Compile and run C code
        shell: cmd
        run: ${{ matrix.compile }}

  cross-compile:
    name: cross-compile (${{ matrix.arch }})
    needs: validate
    # This label is not registered until the Windows runner exists.
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64_x86
            compile: cl.exe hello.c && hello.exe
          - arch: amd64_arm64
            compile: cl.exe hello.c && dumpbin /headers hello.exe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download action bundle
        uses: actions/download-artifact@v8
        with:
          name: action-bundle
          path: dist

      - name: Enable Developer Command Prompt (${{ matrix.arch }})
        uses: ./
        with:
          arch: ${{ matrix.arch }}

      - name: Compile C code (${{ matrix.arch }})
        shell: cmd
        run: ${{ matrix.compile }}
